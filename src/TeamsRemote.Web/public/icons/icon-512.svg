<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Remote Icon: Stylized phone device with mic indicator -->
  <g filter="url(#shadow)" transform="translate(136, 96)">
    <!-- Smartphone frame -->
    <rect x="0" y="0" width="240" height="320" rx="36" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" />
    
    <!-- Screen -->
    <rect x="18" y="24" width="204" height="272" rx="20" fill="#1e293b" />
    
    <!-- Microphone icon in screen center -->
    <g transform="translate(70, 75)">
      <!-- Mic body -->
      <rect x="35" y="15" width="30" height="55" rx="15" fill="#38bdf8" />
      <!-- Mic stand arc -->
      <path d="M 20 45 A 30 30 0 0 0 80 45" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" />
      <!-- Stand stem -->
      <line x1="50" y1="75" x2="50" y2="100" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" />
      <!-- Stand base -->
      <line x1="30" y1="100" x2="70" y2="100" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Signal waves radiating from top -->
    <path d="M 70 240 Q 120 220 170 240" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 85 255 Q 120 242 155 255" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
